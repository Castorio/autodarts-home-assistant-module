trigger_intent:
  fields:
    slot:
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 5
          mode: box
    data:
      required: false
      example: "party"
      selector:
        text:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: io_darts
